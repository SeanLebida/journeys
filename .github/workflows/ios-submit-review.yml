name: iOS Submit for App Review

# Attaches a processed TestFlight build to an App Store version and submits it
# to App Review with the App Store Connect API key the iOS workflow uses.
# Release type is always MANUAL: an approved version waits for a person.
#
# mode=check only reads and reports what is missing. mode=withdraw cancels the
# review submission of withdraw_version (also when it is Pending Developer
# Release), leaving it Developer Rejected; submit then reuses that record.
# mode=submit makes the changes. Review notes come from
# docs/app-review-notes.txt, What's New from docs/appstore-whatsnew.txt (all
# changes since the live App Store version) or the newest CHANGELOG.md entry. Listing fields are left as they are.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check reads only. withdraw pulls withdraw_version from review or release. submit attaches the build and submits.'
        required: true
        default: 'check'
        type: choice
        options:
          - check
          - withdraw
          - submit
      version:
        description: 'Marketing version, e.g. 0.3.28'
        required: true
        type: string
      build_number:
        description: 'CFBundleVersion of the TestFlight build, e.g. 336'
        required: true
        type: string
      withdraw_version:
        description: 'withdraw only: the version to pull (it ends Developer Rejected; nothing is released)'
        required: false
        type: string

concurrency:
  group: ios-submit-review
  cancel-in-progress: false

jobs:
  submit:
    name: App Review (${{ inputs.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install --quiet 'pyjwt[crypto]==2.10.1'
      - name: App Store Connect
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          MODE: ${{ inputs.mode }}
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          WITHDRAW_VERSION: ${{ inputs.withdraw_version }}
        run: python3 scripts/asc-submit-review.py
