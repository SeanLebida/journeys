name: iOS App Store

# Signed App Store archive on Xcode 26 (required since 2026-04-28), then
# TestFlight upload when the Apple secrets below exist.
#
# Run from production once this file is on that branch. workflow_dispatch
# also works from the branch that contains this file.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   IOS_DISTRIBUTION_CERTIFICATE_BASE64  Apple Distribution .p12, base64
#   IOS_DISTRIBUTION_CERTIFICATE_PASSWORD  password for that .p12
#   IOS_PROVISIONING_PROFILE_BASE64  App Store profile for how.authentic.journeys
#   APPLE_TEAM_ID  10-character Team ID (also read from the profile if set there)
#   APPSTORE_ISSUER_ID  App Store Connect API issuer
#   APPSTORE_KEY_ID  API key id
#   APPSTORE_PRIVATE_KEY  contents of the AuthKey .p8
#
# `compile-only` does not need those secrets. It builds the unsigned simulator
# app on the iOS 26 SDK so the project is known to compile.

on:
  workflow_dispatch:
    inputs:
      destination:
        description: 'compile-only skips signing. testflight uploads the IPA.'
        required: true
        default: 'testflight'
        type: choice
        options:
          - compile-only
          - testflight
      build_number:
        description: 'Override CFBundleVersion (empty = git commit count)'
        required: false
        type: string

jobs:
  ios:
    name: Build iOS
    runs-on: macos-26
    timeout-minutes: 120
    env:
      IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          sw_vers

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Prepare iOS version
        if: ${{ inputs.destination != 'compile-only' }}
        env:
          IOS_BUILD_NUMBER: ${{ inputs.build_number }}
        run: npm run ios:version:bump

      - name: Compile unsigned simulator app
        if: ${{ inputs.destination == 'compile-only' }}
        working-directory: ios/App
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Require signing secrets
        if: ${{ inputs.destination == 'testflight' }}
        run: |
          set -euo pipefail
          missing=0
          for name in IOS_DISTRIBUTION_CERTIFICATE_BASE64 IOS_DISTRIBUTION_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 APPSTORE_ISSUER_ID APPSTORE_KEY_ID APPSTORE_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the secrets listed in docs/APP_STORE.md, then rerun with destination=testflight."
            exit 1
          fi
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: Install distribution certificate and profile
        id: signing
        if: ${{ inputs.destination == 'testflight' }}
        env:
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 -D > "$CERT_PATH"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          {
            echo "PROFILE_NAME<<EOF"
            echo "$NAME"
            echo "EOF"
            echo "SIGN_TEAM_ID=$TEAM_ID"
          } >> "$GITHUB_ENV"
          echo "Installed profile $NAME ($PROFILE_UUID)"

      - name: Sign only the App target
        if: ${{ inputs.destination == 'testflight' }}
        run: |
          python3 <<'PY'
          import os
          import pathlib
          import re
          pbx_path = pathlib.Path("ios/App/App.xcodeproj/project.pbxproj")
          text = pbx_path.read_text()
          team = os.environ["SIGN_TEAM_ID"]
          profile = os.environ["PROFILE_NAME"]
          settings = {
              "CODE_SIGN_STYLE": "Manual",
              "DEVELOPMENT_TEAM": team,
              "CODE_SIGN_IDENTITY": '"iPhone Distribution"',
              "PROVISIONING_PROFILE_SPECIFIER": '"' + profile.replace('"', "") + '"',
          }

          def patch(block):
              marker = "PRODUCT_BUNDLE_IDENTIFIER = how.authentic.journeys;"
              if marker not in block:
                  return block
              for key, value in settings.items():
                  line = f"{key} = {value};"
                  pattern = re.compile(rf"\t\t\t\t{key} = [^;]+;")
                  if pattern.search(block):
                      block = pattern.sub("\t\t\t\t" + line, block)
                  else:
                      block = block.replace(marker, marker + "\n\t\t\t\t" + line, 1)
              return block

          parts = re.split(r"(?=\t\t[A-F0-9]+ /\* (?:Debug|Release) \*/ = \{)", text)
          updated = "".join(patch(part) for part in parts)
          if updated == text:
              raise SystemExit("App target signing settings were not written")
          pbx_path.write_text(updated)
          print("App target signed manually. Pod targets were left alone.")
          PY

      - name: Archive signed app
        if: ${{ inputs.destination == 'testflight' }}
        working-directory: ios/App
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Journeys.xcarchive" \
            archive

      - name: Export IPA
        id: ipa
        if: ${{ inputs.destination == 'testflight' }}
        run: |
          set -euo pipefail
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' '<plist version="1.0"><dict/></plist>' > "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string ${SIGN_TEAM_ID}" "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :signingCertificate string iPhone Distribution" "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :destination string export" "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:how.authentic.journeys string ${PROFILE_NAME}" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Journeys.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          IPA="$(echo "$RUNNER_TEMP"/export/*.ipa)"
          echo "path=$IPA" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        if: ${{ inputs.destination == 'testflight' }}
        run: |
          set -euo pipefail
          npm run android:release:notes
          {
            echo "notes<<NOTES_EOF"
            cat android/release-notes/whatsnew-en-US
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        if: ${{ inputs.destination == 'testflight' }}
        uses: actions/upload-artifact@v7
        with:
          name: journeys-ipa
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error

      - name: Upload to TestFlight
        if: ${{ inputs.destination == 'testflight' }}
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          uses-non-exempt-encryption: 'false'
          wait-for-processing: 'true'
          backend: altool
          release-notes: ${{ steps.notes.outputs.notes }}
