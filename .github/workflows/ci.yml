name: CI

# Quality gate for the production line. Pushes to development or main do not
# run this. Use workflow_dispatch on a feature branch, or open a pull request
# into production.
on:
  push:
    branches: [production]
  pull_request:
    branches: [production]
  workflow_dispatch:

jobs:
  web:
    name: typecheck · lint · test · build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:content # validates content/ + compiles Bible DB (the accuracy gate)
      - run: npm run build

  # Native (iOS/Android) build + Appium offline E2E are added in M7/M9.
  # iOS requires macOS runners + signing secrets; tracked as a release gate.
